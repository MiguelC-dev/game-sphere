<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contato</title>
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="../css/contato.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;700&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <header>
      <h1>
        <span class="gs">GS </span>
        News
      </h1>
      <nav>
        <a href="../index.html" class="nav-btn">Inicio</a>
      <a href="../noticias/noticias.html" class="nav-btn">Notícias</a>
        <a href="../reviews/reviews.html" class="nav-btn">Reviews</a>
        <a href="#" class="nav-btn">Contato</a>
      </nav>
    </header>
    <main>
        <h1 class="logo">
            <span class="game-sphere">Game Sphere </span> <span class="news"> News</span>
        </h1>
        
        <h2 class="sublogo">
            Obrigado por visitar o Game Sphere News, caso tenha alguma dúvida, 
            sugestão ou quiser compartilhar algo, não hesite em nos contatar!
        </h2>

      <section class="contato">
         <form class="form-contato">

        <label>Nome</label>
        <input type="text" placeholder="Digite seu nome" maxlength="50" required>

        <label>E-mail</label>
        <input type="email" placeholder="Digite seu e-mail" maxlength="100" required>

        <label>Assunto</label>
        <input type="text" placeholder="Assunto da mensagem" maxlength="100" required>

        <label>Mensagem</label>
        <textarea rows="6" placeholder="Digite sua mensagem" maxlength="500" required></textarea>

        <button type="submit" class="botao">
            Enviar
        </button>

          </form>
      </section>
        <footer>
            <p>© 2026 Game Sphere - Todos os direitos reservados</p>
        </footer>
    </main>
  </body>
</html>
